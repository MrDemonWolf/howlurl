name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      # Validates wrangler.jsonc and the bundle without touching Cloudflare.
      - run: bunx wrangler deploy --dry-run
